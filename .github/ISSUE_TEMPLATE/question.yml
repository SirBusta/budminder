name: Question or idea
description: Ask how to do something, or suggest an improvement.
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question or idea
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: BudMinder version (if it's about the one you run)
      description: Shown at the bottom of every page.
