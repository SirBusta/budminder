version: '3.8'

services:
  budminder:
    image: ghcr.io/sirbusta/budminder:${BUDMINDER_VERSION:-latest}
    ports:
      - "8080:8080"
    environment:
      - BUDMINDER_PORT=8080
      - BUDMINDER_DB_DRIVER=sqlite
      - BUDMINDER_SESSION_SECRET=${BUDMINDER_SESSION_SECRET:-}
    volumes:
      - isley-db:/app/data
      - isley-uploads:/app/uploads
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

volumes:
  isley-db:
  isley-uploads:
