al_wake_po_and_1: "Dans l’app Pushover, touchez **⋮** en haut à droite, puis **Settings**."
al_wake_po_and_2: "Activez **Play high-priority as alarm**."
al_wake_po_and_note: "Pushover joue ces notifications comme une alarme, au volume de l’alarme. Elles sonnent sauf si les alarmes sont désactivées dans les paramètres Ne pas déranger du téléphone."
al_wake_po_ios_1: "Dans l’app Pushover, ouvrez **Settings**."
al_wake_po_ios_2: "Activez **Critical Alerts** pour la priorité haute. Si l’iPhone le demande, autorisez les alertes critiques."
