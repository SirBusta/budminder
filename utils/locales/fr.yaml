# First-run tour (web/static/js/tour.js)
tour_ask_title: "Envie d'une visite rapide ?"
tour_ask_text: "Quatre astuces courtes montrent comment fonctionne BudMinder, avec des images et de courts clips. Comptez environ 3 minutes."
tour_ask_demo_title: "Bienvenue dans la démo de BudMinder"
tour_ask_demo_text: "Voulez-vous d'abord une visite rapide ? Quatre astuces courtes avec images et clips, environ 3 minutes."
tour_ask_later: "Vous pourrez la faire à tout moment depuis l'Aide."
tour_yes: "Faites-moi visiter"
tour_no: "Non merci"
tour_tip_of: "Astuce {n} sur {total}"
tour_next: "Suivant"
tour_back: "Retour"
