wn_2_0_f1_p4: "Des capteurs cessent d’envoyer des relevés"
wn_2_2_f1_title: "Prix des paquets dans le Coffre à graines"
wn_2_2_f1_text: "Saisissez le prix du paquet lorsque vous ajoutez des graines, réapprovisionnez ou modifiez une variété. Marquez un paquet gratuit comme Offert."
wn_2_2_f1_p1: "Chaque paquet apparaît sur la carte de la variété avec son prix et sa date d’ajout"
wn_2_2_f1_p2: "Dès qu’un paquet a un prix, le haut du Coffre à graines affiche le Coût et la Valeur totaux"
wn_2_2_f1_p3: "La page de chaque variété affiche ses paquets, avec le Coût et la Valeur de ses graines"
wn_2_2_f1_after: "Le Coût est ce que vous avez payé pour les graines qu’il vous reste. La Valeur est ce qu’elles coûteraient à l’achat, paquets offerts compris."
wn_2_2_f1_link: "Ouvrir le Coffre à graines"
wn_2_2_f2_title: "Choisissez effets, saveurs et terpènes dans une liste"
wn_2_2_f2_text: "Lorsque vous ajoutez ou modifiez une variété, choisissez les effets, saveurs, terpènes et ce pour quoi elle peut aider dans des listes de noms courants. Si un nom n’y figure pas, saisissez-le dans le champ Autre."
wn_2_2_f2_link: "Ajouter une variété"
wn_2_3_f1_title: "Plus de détails dans Alertes récentes"
wn_2_3_f1_text: "La liste Alertes récentes, dans Paramètres > Alertes, affiche désormais plus d’informations sur chaque alerte :"
wn_2_3_f1_p1: "Cliquez sur une alerte pour la voir sur le graphique de la page Capteurs, avec sa période active ombrée et sa limite en pointillés"
wn_2_3_f1_p2: "Le relevé au début de l’alerte et le relevé le plus haut ou le plus bas pendant qu’elle était active"
wn_2_3_f1_p3: "La limite haute ou basse atteinte par le relevé. Si la limite a changé pendant l’alerte, par exemple de la limite lumières allumées à la limite lumières éteintes, chaque valeur est indiquée"
wn_2_3_f1_after: "Les alertes antérieures à cette mise à jour n’indiquent que la limite."
wn_2_3_f1_link: "Voir les alertes récentes"
wn_2_3_o1: "Les titres des alertes de capteurs indiquent désormais la zone, par exemple « CO2 élevé dans 3x3 ACI Tent », dans l’application et dans l’objet des e-mails."
wn_2_3_fig_alt: "Un clic sur une alerte dans Alertes récentes ouvre son graphique sur la page Capteurs, avec la période de l’alerte ombrée et la limite en pointillés."
wn_2_3_fig_alert: "Température élevée : {value}"
wn_2_4_f1_title: "Capteurs Vivosun"
wn_2_4_f1_text: "BudMinder peut désormais enregistrer les mesures des appareils Vivosun, comme la température, l’humidité, le VPD et le CO₂, ainsi que les niveaux de leurs lampes, ventilateurs et prises. Il les lit sur les serveurs de Vivosun et ne modifie jamais les réglages d’un appareil."
wn_2_4_f1_p1: "Connectez-vous avec votre compte de l’app Vivosun dans Paramètres > Intégrations"
wn_2_4_f1_p2: "Ouvrez ensuite Gérer les capteurs depuis Paramètres > Capteurs et appareils, sélectionnez Rechercher Vivosun et ajoutez les capteurs de votre appareil à une tente"
wn_2_4_f1_beta: "Testé uniquement avec le VCure C80 pour l’instant. Si votre appareil n’apparaît pas ou si ses mesures semblent fausses, téléchargez ses données brutes depuis Dépannage sur la page Gérer les capteurs et envoyez-les par e-mail à"
wn_2_4_f1_beta_after: "Les données personnelles sont automatiquement retirées du fichier."
wn_2_4_f1_link: "Configurer Vivosun"
wn_2_4_o1: "Une nouvelle carte Dépannage sur la page Gérer les capteurs affiche les données brutes qu’AC Infinity et Vivosun envoient pour vos appareils, prêtes à être téléchargées et envoyées par e-mail à l’assistance."
wn_2_5_f1_title: "Plus de moyens de recevoir les notifications d’alerte"
wn_2_5_f1_text: "En plus de l’e-mail, BudMinder peut désormais envoyer les notifications d’alerte vers :"
wn_2_5_f1_p1: "Pushover, l’app Home Assistant ou ntfy sur votre téléphone"
wn_2_5_f1_p2: "Un salon Discord"
wn_2_5_f1_p3: "Un webhook, pour des outils comme Node-RED ou n8n"
wn_2_5_f1_after: "Pour Pushover, l’app Home Assistant et ntfy sur Android, choisissez Me réveiller pour entendre les notifications même quand le téléphone est en silencieux ou en Ne pas déranger. Configurez chaque méthode dans Méthodes de notification, sous Paramètres > Alertes."
wn_2_5_f1_link: "Configurer les notifications"
wn_2_5_f2_title: "Paramètres de « À surveiller » et tâches récurrentes"
wn_2_5_f2_text: "Sur la page Aujourd'hui, cliquez sur Paramètres à côté de « À surveiller » pour :"
wn_2_5_f2_p1: "Choisir les rappels affichés, et après combien de jours l’arrosage, la fertilisation et les photos sont à faire"
wn_2_5_f2_p2: "Ajouter des tâches récurrentes, comme remplir un réservoir"
wn_2_5_f2_p3: "Activer un rappel pour aérer les bocaux des plantes en affinage"
wn_2_5_f2_after: "Cliquez sur × sur un rappel pour le masquer jusqu’à demain, ou jusqu’à ce que ce soit fait."
wn_2_5_f2_link: "Ouvrir la page Aujourd'hui"
wn_2_5_o1: "BudMinder envoie désormais une notification d’alerte quand AC Infinity, Vivosun ou Home Assistant refuse la connexion de BudMinder, ou quand une intégration ne répond plus."
wn_2_5_o2: "Paramètres > Téléphone et tablette affiche un code QR qui ouvre BudMinder sur votre téléphone, et explique comment ajouter BudMinder à l’écran d’accueil."
wn_2_5_o3: "Les carnets des plantes ont une nouvelle activité, Top Dress. Indiquez dans la note ce que vous avez ajouté."
wn_2_5_x1: "Les pages Aujourd'hui et Plantes comptent désormais les jours dans le fuseau horaire choisi dans Paramètres > Général : une plante arrosée aujourd’hui n’apparaît plus comme arrosée hier."

