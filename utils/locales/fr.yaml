st_vs_beta_note: "Testé pour l'instant uniquement avec le VCure C80. Si votre appareil n'apparaît pas ou si ses mesures semblent fausses, sélectionnez Capteurs et appareils ci-dessus. En bas de cette page, sous Dépannage, sélectionnez Voir les données brutes à côté de Vivosun, puis Télécharger. Les données personnelles sont retirées du fichier. Envoyez-le par e-mail à"
