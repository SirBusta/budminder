al_wake_ntfy_sam_1: "Dans les **Paramètres** du téléphone, allez dans **Notifications > Ne pas déranger > Notifications d’applications > Ajouter des applications** et choisissez **ntfy**."
al_wake_ntfy_sam_2: "Le téléphone laisse alors aussi passer les notifications de fin d’alerte en Ne pas déranger. Pour les rendre silencieuses, allez dans **Paramètres > Applications > ntfy > Notifications > Catégories de notifications**, touchez **Priorité par défaut** (son nom, pas son interrupteur) et choisissez **Silencieux**. Les notifications de fin d’alerte arrivent alors toujours sans son."
al_wake_ntfy_sam_note: "Si **Catégories de notifications** n’apparaît pas, allez dans **Paramètres > Notifications > Paramètres avancés** et activez **Gérer les catégories de notifications de chaque application**."
al_wake_ntfy_other: "Autres téléphones Android"
al_wake_ntfy_oth_1: "Dans les **Paramètres** du téléphone, allez dans **Applications > ntfy > Notifications**."
al_wake_ntfy_oth_2: "Touchez **Priorité maximale** (son nom, pas son interrupteur) et activez **Ignorer Ne pas déranger**."
