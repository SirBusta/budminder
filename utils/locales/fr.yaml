st_vs_not_signed_in: "Non connecté"
st_vs_signin_desc: "Connectez-vous avec votre compte de l'application Vivosun. BudMinder obtient les mesures depuis les serveurs de Vivosun et a donc besoin d'une connexion Internet. Les mesures arrivent avec environ une minute de retard."
