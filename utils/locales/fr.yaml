tour_pause: "Pause"
tour_play: "Lire"
tour_replay: "Revoir"
tour_tip1: "Variétés"
tour_tip2: "Stades"
tour_tip3: "Journal"
tour_tip4: "Capteurs"
tour_help_title: "Nouveau sur BudMinder ? Faites la visite"
tour_help_text: "Quatre astuces courtes avec images et clips, environ 3 minutes."
tour_help_start: "Commencer la visite"
tour_help_jump: "Ou allez directement à :"
tour_side: "Faire la visite"
tour_1_1_title: "Commencez par la variété"
tour_1_1_alt: "Le menu du haut, avec Variétés"
tour_1_1_1: "Dans BudMinder, chaque plante pousse <b>à partir d'une variété</b> : ajoutez donc d'abord la variété."
tour_1_1_2: "Son obtenteur, sa génétique, sa durée de floraison et l'estimation de récolte viennent avec."
tour_1_1_3: "Les variétés se trouvent sous <b>Variétés</b>, dans le menu du haut."
tour_1_2_title: "Recherchez-la"
tour_1_2_1: "Sur la page Variétés, cliquez sur <b>Chercher sur StrainCompass</b>."
tour_1_2_2: "Tapez le nom de la variété."
tour_1_2_3: "Cliquez sur <b>Rechercher</b> pour voir les résultats."
tour_1_2_4: "Choisissez celle de votre obtenteur et cliquez sur <b>Ajouter</b>."
tour_1_2_5: "Choisissez où elle va : <b>Coffre à graines</b>, <b>Envie</b> ou <b>Bibliothèque seulement</b>."
tour_1_2_6: "Passez à la vérification, contrôlez les détails et enregistrez."
tour_1_2_after: "Pas dans la liste ? Utilisez plutôt <b>Saisir à la main</b> sur la page Variétés."
tour_1_3_title: "La page de votre variété"
tour_1_3_alt: "La page d'une variété, remplie"
tour_1_3_1: "Après l'enregistrement d'une variété, sa page s'ouvre avec tout rempli : photopériodique ou autofloraison, type de graine et part indica/sativa."
tour_1_3_2: "<b>Modifier</b> change ce que vous voulez, comme vos propres taux de THC ou le nombre de graines."
tour_1_3_3: "<b>Lancer une culture</b> est l'étape suivante si vous voulez cultiver cette variété."
tour_1_4_title: "Lancer une culture"
tour_1_4_alt: "Ajouter une plante, rempli depuis la variété"
tour_1_4_1: "<b>Lancer une culture</b> ouvre « Ajouter une plante », déjà rempli avec les informations de la variété."
tour_1_4_2: "La plante reçoit un nom, que vous pouvez changer."
tour_1_4_3: "La <b>Zone</b> est la tente ou l'emplacement extérieur où elle pousse. Première plante ? Choisissez <b>Ajouter une nouvelle zone</b> et nommez-la sur place."
tour_1_4_4: "La date de début est aujourd'hui ; changez-la si vous avez planté plus tôt."
tour_1_4_5: "Une graine est prise dans votre coffre si cette option est cochée."
tour_1_4_6: "Cliquez sur <b>Ajouter une plante</b>, et le journal de la plante commence."
tour_1_4_7: "Vous trouverez « Lancer une culture » sur la page de chaque variété."
tour_2_1_title: "Chaque plante passe par des stades de croissance"
tour_2_1_alt: "La barre des stades d'une plante"
tour_2_1_1: "La page de chaque plante a une barre des stades, de Germination à Succès."
tour_2_1_2: "Le stade actuel est mis en évidence par un anneau."
tour_2_1_3: "Sous chaque stade atteint s'affiche le nombre de jours passés dedans."
tour_2_2_title: "Passer d'un stade à l'autre"
tour_2_2_1: "Quand votre plante entre dans un nouveau stade, cliquez sur ce stade."
tour_2_2_2: "La date du jour est déjà saisie ; mettez une date antérieure si besoin."
tour_2_2_3: "Cliquez sur <b>Passer à Floraison</b>, et la plante entre en floraison."
tour_2_3_title: "Pourquoi la date compte"
tour_2_3_alt: "La ligne du haut et la barre des stades d'une plante"
tour_2_3_1: "Pour les plantes photopériodiques, l'estimation de récolte est calculée à partir du jour du passage en Floraison."
tour_2_3_2: "Si la <b>Durée de floraison</b> n'est pas renseignée sur la page de la variété, l'estimation de récolte affiche « Non défini »."
tour_2_3_3: "Pour les autofloraisons, l'estimation de récolte est calculée à partir de la date de début de la plante."
tour_2_3_4: "Mauvaise date ? Cliquez sur un stade déjà franchi par la plante pour modifier sa date de début."
tour_3_1_title: "Une entrée par jour"
tour_3_1_alt: "Le journal d'une plante"
tour_3_1_1: "Chaque plante a un journal, avec une entrée par jour."
tour_3_1_2: "Les jours sont regroupés par stade et par semaine, comme Végétatif · Semaine 5."
tour_3_2_title: "Noter l'activité du jour"
tour_3_2_1: "Cliquez sur <b>Ajouter une activité</b> pour noter aujourd'hui ou un jour précédent."
tour_3_2_2: "Sélectionnez ce que vous avez fait : arrosage, engrais, palissage et plus."
tour_3_2_3: "Saisissez les quantités."
tour_3_2_4: "Ajoutez une note si vous voulez, puis cliquez sur <b>Enregistrer</b>."
tour_3_3_title: "Les photos vont avec les jours"
tour_3_3_alt: "Le journal avec les photos d'un jour à côté"
tour_3_3_1: "Cliquez sur un jour pour voir ses photos à côté de ses notes."
tour_3_3_2: "Ajoutez des photos avec le bouton appareil photo. Chaque photo va au jour où elle a été prise, lu dans la photo elle-même."
tour_3_3_3: "Sélectionnez un jour, puis cliquez sur <b>Modifier</b> pour changer son entrée."
tour_3_3_4: "<b>Toutes les plantes</b> montre les journaux de toutes les plantes dans une seule liste."
tour_4_1_title: "Connectez vos capteurs"
tour_4_1_alt: "La carte Home Assistant dans les Paramètres"
tour_4_1_1: "Les capteurs sont facultatifs. Si vous en utilisez, la connexion se fait en deux étapes."
tour_4_1_2: "D'abord, activez les vôtres dans <b>Paramètres → Intégrations</b> : AC Infinity, Ecowitt ou Home Assistant."
tour_4_1_3: "Remplissez ce qui est demandé, comme votre compte AC Infinity ou l'adresse de Home Assistant."
tour_4_2_title: "Trouvez-les et placez-les dans une tente"
tour_4_2_1: "Allez ensuite dans <b>Capteurs → Gérer les capteurs</b>."
tour_4_2_2: "Cliquez sur <b>Rechercher</b> pour trouver vos capteurs."
tour_4_2_3: "Choisissez la tente de chaque capteur et cliquez sur <b>Ajouter</b>."
tour_4_2_4: "Il est maintenant dans cette tente, et ses mesures s'afficheront dans les graphiques de la tente."
tour_4_3_title: "Vous êtes prêt à cultiver"
tour_4_3_alt: "La page Capteurs et le menu du haut"
tour_4_3_1: "Les mesures s'affichent sur la page <b>Capteurs</b> et dans <b>Aujourd'hui</b>."
tour_4_3_2: "Besoin d'aide ? Le bouton <b>?</b> ouvre le manuel à la page où vous êtes."
tour_4_3_3: "C'est la fin de la visite. Commencez par ajouter votre première variété."

