al_po_note: "Pushover ist eine App für dringende Benachrichtigungen, für iPhone und Android, mit einem einmaligen Kauf nach 30 Tagen Testzeit. Für ein API-Token legen Sie auf der Pushover-Website eine Anwendung für BudMinder an."
