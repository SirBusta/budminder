st_vs_enabled_info: "Vivosun-Sensoren lesen"
st_vs_manage_desc: "Die Sensoren deiner Vivosun-Geräte finden und einem Zelt zuordnen."
st_vs_beta_note: "Bisher nur mit dem VCure C80 getestet. Wenn dein Gerät fehlt oder seine Werte falsch aussehen, wähle oben „Sensoren & Geräte“. Wähle unten auf dieser Seite unter „Fehlersuche“ neben Vivosun „Rohdaten ansehen“ und dann „Herunterladen“. Persönliche Daten werden aus der Datei entfernt. Schicke sie per E-Mail an"
st_vs_beta_note_end: ", damit dein Gerät unterstützt oder korrigiert werden kann."
st_vs_login_title: "Vivosun-Anmeldung"
st_vs_login_intro: "Verwende E-Mail und Passwort deines Kontos der Vivosun-App. BudMinder sendet sie nur an Vivosun."
st_vs_stay_help: "BudMinder speichert dein Vivosun-Passwort verschlüsselt und meldet sich selbst wieder an, wenn Vivosun es abmeldet. Der Schlüssel liegt in einer eigenen Datei im Datenordner von BudMinder, nicht in der Datenbank oder in Backups. Verwende ein Passwort, das du sonst nirgends nutzt."
st_vs_signed_in_toast: "Bei Vivosun angemeldet. Um Werte aufzuzeichnen, wähle „Sensoren & Geräte“ und dann „Vivosun durchsuchen“."
