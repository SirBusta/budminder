al_wake_intro: "Pushover, die Home Assistant App und ntfy (nur Android) können Sie wecken, auch wenn das Telefon stummgeschaltet ist oder „Nicht stören“ an ist: Wählen Sie bei der Methode **Mich wecken**. E-Mail, Discord und Webhooks halten sich immer an die Toneinstellungen des Telefons."
al_wake_badge: "Kann Sie wecken"
al_wake_badge_android: "Kann Sie unter Android wecken"
al_wake_label: "Alarmbenachrichtigungen"
al_wake_clears: "Entwarnungen kommen immer als normale Benachrichtigungen an."
al_wake_regular: "Normal"
al_wake_regular_note: "Klingelt und vibriert wie Ihre anderen Benachrichtigungen. Lautlos, wenn das Telefon stummgeschaltet ist oder „Nicht stören“ an ist."
al_wake_wake: "Mich wecken"
al_wake_wake_note: "Ertönt auch, wenn das Telefon stummgeschaltet ist oder „Nicht stören“ an ist. Erfordert eine einmalige Einrichtung am Telefon."
al_wake_repeat: "Mich wecken und wiederholen"
al_wake_repeat_note: "Wird außerdem alle 5 Minuten wiederholt, bis zu 3 Stunden lang, bis Sie es in der Pushover-App bestätigen."
al_wake_st_regular: "Normal"
al_wake_st_wake: "Weckt Sie"
al_wake_st_repeat: "Weckt Sie und wird wiederholt"
al_wake_setup: "Telefon einrichten, damit Alarme Sie wecken"
al_wake_android: "Android"
al_wake_iphone: "iPhone"
al_wake_po_and_1: "Tippen Sie in der Pushover-App oben rechts auf **⋮** und dann auf **Settings**."
al_wake_po_and_2: "Schalten Sie **Play high-priority as alarm** ein."
al_wake_po_and_note: "Pushover spielt diese Benachrichtigungen wie einen Wecker ab, in Weckerlautstärke. Sie ertönen, sofern Wecker in den „Nicht stören“-Einstellungen des Telefons nicht ausgeschaltet sind."
al_wake_po_ios_1: "Öffnen Sie in der Pushover-App **Settings**."
al_wake_po_ios_2: "Schalten Sie **Critical Alerts** für hohe Priorität ein. Wenn das iPhone fragt, erlauben Sie kritische Hinweise."
al_wake_po_ios_2_repeat: "Schalten Sie **Critical Alerts** für Notfall-Priorität ein. Wenn das iPhone fragt, erlauben Sie kritische Hinweise."
al_wake_ha_and: "Nichts einzurichten. Die Home Assistant App spielt diese Benachrichtigungen wie einen Wecker ab, in Weckerlautstärke. Sie ertönen, sofern Wecker in den „Nicht stören“-Einstellungen des Telefons nicht ausgeschaltet sind."
al_wake_ha_ios_1: "Öffnen Sie die App **Einstellungen** auf dem iPhone."
al_wake_ha_ios_2: "Gehen Sie zu **Mitteilungen > Home Assistant** und schalten Sie **Kritische Hinweise** ein."
al_wake_ntfy_samsung: "Samsung-Telefone"
al_wake_ntfy_sam_1: "Gehen Sie in den **Einstellungen** des Telefons zu **Benachrichtigungen > Nicht stören > App-Benachrichtigungen > Apps hinzufügen** und wählen Sie **ntfy**."
al_wake_ntfy_sam_2: "Das Telefon lässt dann auch Entwarnungen bei „Nicht stören“ durch. Um sie stummzuschalten, gehen Sie zu **Einstellungen > Apps > ntfy > Benachrichtigungen > Benachrichtigungskategorien**, tippen Sie auf **Standard-Priorität** (den Namen, nicht den Schalter) und wählen Sie **Lautlos**. Entwarnungen kommen dann immer ohne Ton an."
al_wake_ntfy_sam_note: "Wenn **Benachrichtigungskategorien** fehlt, gehen Sie zu **Einstellungen > Benachrichtigungen > Erweiterte Einstellungen** und schalten Sie **Benachrichtigungskategorien für jede App verwalten** ein."
al_wake_ntfy_other: "Andere Android-Telefone"
al_wake_ntfy_oth_1: "Gehen Sie in den **Einstellungen** des Telefons zu **Apps > ntfy > Benachrichtigungen**."
al_wake_ntfy_oth_2: "Tippen Sie auf **Höchste Priorität** (den Namen, nicht den Schalter) und schalten Sie **„Bitte nicht stören“ ignorieren** ein."
al_wake_ntfy_ios: "ntfy kann nicht ertönen, wenn ein iPhone stummgeschaltet ist oder „Nicht stören“ an ist. Um auf einem iPhone geweckt zu werden, verwenden Sie Pushover oder die Home Assistant App."
al_wake_test_hint: "Um zu prüfen, ob Alarme Sie wecken, klicken Sie auf In 30 Sekunden senden, sperren Sie dann das Telefon und schalten Sie „Nicht stören“ ein."
