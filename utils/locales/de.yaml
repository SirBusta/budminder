st_vs_not_signed_in: "Nicht angemeldet"
st_vs_signin_desc: "Melde dich mit deinem Konto der Vivosun-App an. BudMinder holt die Werte von den Servern von Vivosun und braucht deshalb eine Internetverbindung. Die Werte kommen etwa eine Minute verzögert an."
st_vs_auto_signin_on: "Meldet sich automatisch wieder an, wenn Vivosun es abmeldet."
st_vs_sign_in: "Anmelden"
