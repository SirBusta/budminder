wn_2_2_f1_title: "Packungspreise im Samentresor"
wn_2_2_f1_text: "Geben Sie einen Packungspreis ein, wenn Sie Samen hinzufügen, auffüllen oder eine Sorte bearbeiten. Markieren Sie eine kostenlose Packung als Gratis."
wn_2_2_f1_p1: "Jede Packung erscheint auf der Karte der Sorte mit ihrem Preis und dem Datum, an dem sie hinzugefügt wurde"
wn_2_2_f1_p2: "Sobald eine Packung einen Preis hat, zeigt der Samentresor oben die Kosten und den Wert insgesamt"
wn_2_2_f1_p3: "Die Seite jeder Sorte zeigt ihre Packungen mit den Kosten und dem Wert ihrer Samen"
wn_2_2_f1_after: "Die Kosten sind, was Sie für die verbliebenen Samen bezahlt haben. Der Wert ist, was sie beim Kauf kosten würden, Gratis-Packungen eingeschlossen."
wn_2_2_f1_link: "Samentresor öffnen"
wn_2_2_f2_title: "Wirkungen, Aromen und Terpene aus einer Liste wählen"
wn_2_2_f2_text: "Wenn Sie eine Sorte hinzufügen oder bearbeiten, wählen Sie Wirkungen, Aromen, Terpene und wobei sie helfen kann aus Listen gängiger Namen. Fehlt ein Name, geben Sie ihn im Feld Andere ein."
wn_2_2_f2_link: "Sorte hinzufügen"
wn_2_3_f1_title: "Mehr Details unter Letzte Warnungen"
wn_2_3_f1_text: "Die Liste Letzte Warnungen unter Einstellungen > Benachrichtigungen zeigt jetzt mehr zu jeder Warnung:"
wn_2_3_f1_p1: "Klicken Sie auf eine Warnung, um sie im Diagramm der Seite Sensoren zu sehen, mit schattiertem aktivem Zeitraum und gestrichelter Grenzlinie"
wn_2_3_f1_p2: "Den Messwert beim Beginn der Warnung und den höchsten oder niedrigsten Messwert, solange sie aktiv war"
wn_2_3_f1_p3: "Die obere oder untere Grenze, die der Messwert erreicht hat. Hat sich die Grenze während der Warnung geändert, zum Beispiel von der Grenze bei Licht an zur Grenze bei Licht aus, wird jeder Wert aufgeführt"
wn_2_3_f1_after: "Vor diesem Update gespeicherte Warnungen zeigen nur die Grenze."
wn_2_3_f1_link: "Letzte Warnungen ansehen"
wn_2_3_o1: "Titel von Sensor-Warnungen nennen jetzt die Zone, zum Beispiel „CO2 zu hoch in 3x3 ACI Tent“, in der App und im Betreff von E-Mails."
wn_2_3_fig_alt: "Ein Klick auf eine Warnung unter Letzte Warnungen öffnet ihr Diagramm auf der Seite Sensoren, mit schattiertem Zeitraum der Warnung und gestrichelter Grenzlinie."
wn_2_3_fig_alert: "Temperatur zu hoch: {value}"
wn_2_4_f1_title: "Vivosun-Sensoren"
wn_2_4_f1_text: "BudMinder kann jetzt Messwerte von Vivosun-Geräten aufzeichnen, etwa Temperatur, Luftfeuchte, VPD und CO₂, sowie die Stufen ihrer Lampen, Lüfter und Steckdosen. Es liest sie von den Servern von Vivosun und ändert nie die Einstellungen eines Geräts."
wn_2_4_f1_p1: "Melden Sie sich unter Einstellungen > Integrationen mit Ihrem Konto der Vivosun-App an"
wn_2_4_f1_p2: "Öffnen Sie dann Sensoren verwalten unter Einstellungen > Sensoren & Geräte, wählen Sie Vivosun durchsuchen und fügen Sie die Sensoren Ihres Geräts einem Zelt hinzu"
wn_2_4_f1_beta: "Bisher nur mit dem VCure C80 getestet. Fehlt Ihr Gerät oder wirken seine Messwerte falsch, laden Sie seine Rohdaten unter Fehlersuche auf der Seite Sensoren verwalten herunter und senden Sie sie per E-Mail an"
wn_2_4_f1_beta_after: "Persönliche Daten werden automatisch aus der Datei entfernt."
wn_2_4_f1_link: "Vivosun einrichten"
wn_2_4_o1: "Eine neue Karte Fehlersuche auf der Seite Sensoren verwalten zeigt die Rohdaten, die AC Infinity und Vivosun zu Ihren Geräten senden, bereit zum Herunterladen und Senden per E-Mail an den Support."

# Vivosun (Beta)
st_vs_desc: "Liest die Sensoren deiner Vivosun-Geräte. BudMinder ändert nie die Einstellungen eines Geräts."
