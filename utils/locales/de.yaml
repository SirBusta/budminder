tour_tip3: "Notizbuch"
tour_tip4: "Sensoren"
tour_help_title: "Neu bei BudMinder? Mach die Tour"
tour_help_text: "Vier kurze Tipps mit Bildern und Clips, etwa 3 Minuten."
tour_help_start: "Tour starten"
tour_help_jump: "Oder direkt zu:"
tour_side: "Tour starten"
tour_1_1_title: "Fang mit der Sorte an"
tour_1_1_alt: "Das obere Menü mit Sorten"
tour_1_1_1: "In BudMinder wächst jede Pflanze <b>aus einer Sorte</b>, also lege zuerst die Sorte an."
tour_1_1_2: "Züchter, Genetik, Blütezeit und Ernteschätzung kommen gleich mit."
tour_1_1_3: "Sorten findest du unter <b>Sorten</b> im oberen Menü."
tour_1_2_title: "Nachschlagen"
tour_1_2_1: "Klicke auf der Sorten-Seite auf <b>Auf StrainCompass suchen</b>."
tour_1_2_2: "Gib den Namen der Sorte ein."
tour_1_2_3: "Klicke auf <b>Suchen</b>, um die Treffer zu sehen."
tour_1_2_4: "Wähle die von deinem Züchter und klicke auf <b>Hinzufügen</b>."
tour_1_2_5: "Wähle, wohin sie kommt: <b>Samentresor</b>, <b>Gewünscht</b> oder <b>Nur Bibliothek</b>."
tour_1_2_6: "Weiter zur Prüfung, Angaben kontrollieren und speichern."
tour_1_2_after: "Nicht dabei? Nutze stattdessen <b>Manuell eingeben</b> auf der Sorten-Seite."
tour_1_3_title: "Die Seite deiner Sorte"
tour_1_3_alt: "Die Seite einer Sorte, ausgefüllt"
tour_1_3_1: "Nach dem Speichern einer Sorte öffnet sich ihre Seite, alles ausgefüllt: photoperiodisch oder Autoflower, Samentyp und Indica/Sativa-Anteil."
tour_1_3_2: "Mit <b>Bearbeiten</b> änderst du alles, etwa deine eigenen THC-Werte oder die Samenzahl."
tour_1_3_3: "<b>Anbau starten</b> ist der nächste Schritt, wenn du diese Sorte anbauen möchtest."
tour_1_4_title: "Anbau starten"
tour_1_4_alt: "Pflanze hinzufügen, aus der Sorte ausgefüllt"
tour_1_4_1: "<b>Anbau starten</b> öffnet „Pflanze hinzufügen“, schon mit den Angaben zur Sorte ausgefüllt."
tour_1_4_2: "Die Pflanze bekommt einen Namen, den du ändern kannst."
tour_1_4_3: "Die <b>Zone</b> ist das Zelt oder der Platz im Freien, an dem sie wächst. Erste Pflanze? Wähle <b>Neue Zone hinzufügen</b> und benenne sie direkt dort."
tour_1_4_4: "Das Startdatum ist heute; ändere es, wenn du früher gepflanzt hast."
tour_1_4_5: "Ein Samen wird aus deinem Tresor genommen, wenn diese Option angehakt ist."
tour_1_4_6: "Klicke auf <b>Pflanze hinzufügen</b>, und das Tagebuch der Pflanze beginnt."
tour_1_4_7: "„Anbau starten“ findest du auf der Seite jeder Sorte."
tour_2_1_title: "Jede Pflanze durchläuft feste Wachstumsphasen"
tour_2_1_alt: "Die Phasenleiste einer Pflanze"
tour_2_1_1: "Die Seite jeder Pflanze hat eine Phasenleiste, von Keimend bis Erfolg."
tour_2_1_2: "Die aktuelle Phase ist mit einem Ring hervorgehoben."
tour_2_1_3: "Unter jeder erreichten Phase steht, wie viele Tage die Pflanze darin war."
tour_2_2_title: "Von Phase zu Phase"
tour_2_2_1: "Wenn deine Pflanze in eine neue Phase kommt, klicke auf diese Phase."
tour_2_2_2: "Das heutige Datum ist schon eingetragen; ändere es bei Bedarf auf ein früheres."
tour_2_2_3: "Klicke auf <b>Zu Blüte wechseln</b>, und die Pflanze ist in der Blüte."
tour_2_3_title: "Warum das Datum zählt"
tour_2_3_alt: "Die obere Zeile und die Phasenleiste einer Pflanze"
tour_2_3_1: "Bei photoperiodischen Pflanzen wird die Ernteschätzung ab dem Tag berechnet, an dem sie in die Blüte kam."
tour_2_3_2: "Ist auf der Sorten-Seite keine <b>Blütezeit</b> eingetragen, zeigt die Ernteschätzung „Nicht festgelegt“."
tour_2_3_3: "Bei Autoflowern wird die Ernteschätzung ab dem Startdatum der Pflanze berechnet."
tour_2_3_4: "Falsches Datum eingetragen? Klicke auf eine Phase, die die Pflanze schon durchlaufen hat, um ihr Startdatum zu ändern."
tour_3_1_title: "Ein Eintrag pro Tag"
tour_3_1_alt: "Das Notizbuch einer Pflanze"
tour_3_1_1: "Jede Pflanze hat ein Notizbuch mit einem Eintrag pro Tag."
tour_3_1_2: "Die Tage sind nach Wachstumsphase und Woche gruppiert, etwa Vegetativ · Woche 5."
tour_3_2_title: "Einen Tag eintragen"
tour_3_2_1: "Klicke auf <b>Aktivität hinzufügen</b>, um heute oder einen früheren Tag einzutragen."
tour_3_2_2: "Wähle, was du gemacht hast: gießen, düngen, trainieren und mehr."
tour_3_2_3: "Gib die Mengen ein."
tour_3_2_4: "Füge bei Bedarf eine Notiz hinzu und klicke auf <b>Speichern</b>."
tour_3_3_title: "Fotos gehören zu Tagen"
tour_3_3_alt: "Das Notizbuch mit den Fotos eines Tages daneben"
tour_3_3_1: "Klicke auf einen Tag, um seine Fotos neben den Notizen zu sehen."
tour_3_3_2: "Füge Fotos mit dem Kamera-Knopf hinzu. Jedes Foto kommt auf den Tag, an dem es aufgenommen wurde, das wird aus dem Foto gelesen."
tour_3_3_3: "Wähle einen Tag und klicke auf <b>Bearbeiten</b>, um seinen Eintrag zu ändern."
tour_3_3_4: "<b>Alle Pflanzen</b> zeigt die Notizbücher aller Pflanzen in einer Liste."
tour_4_1_title: "Sensoren verbinden"
tour_4_1_alt: "Die Home-Assistant-Karte in den Einstellungen"
tour_4_1_1: "Sensoren sind freiwillig. Wenn du welche nutzt, geht das Verbinden in zwei Schritten."
tour_4_1_2: "Schalte deine zuerst unter <b>Einstellungen → Integrationen</b> ein: AC Infinity, Vivosun, Ecowitt oder Home Assistant."
tour_4_1_3: "Trag ein, was verlangt wird, etwa deine AC-Infinity-Anmeldung oder die Adresse von Home Assistant."
tour_4_2_title: "Finden und einem Zelt zuordnen"
tour_4_2_1: "Geh dann zu <b>Sensoren → Sensoren verwalten</b>."
tour_4_2_2: "Klicke auf <b>Suchen</b>, um deine Sensoren zu finden."
tour_4_2_3: "Wähle für jeden Sensor das Zelt und klicke auf <b>Hinzufügen</b>."
tour_4_2_4: "Er gehört jetzt zu diesem Zelt, und seine Werte erscheinen in den Diagrammen des Zelts."
tour_4_3_title: "Du bist bereit zum Anbauen"
tour_4_3_alt: "Die Sensoren-Seite und das obere Menü"
tour_4_3_1: "Die Werte erscheinen auf der Seite <b>Sensoren</b> und unter <b>Heute</b>."
tour_4_3_2: "Brauchst du mehr Hilfe? Der Knopf <b>?</b> öffnet das Handbuch an der Stelle der Seite, auf der du bist."
tour_4_3_3: "Das war die Tour. Fang mit deiner ersten Sorte an."

