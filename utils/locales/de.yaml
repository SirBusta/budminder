# First-run tour (web/static/js/tour.js)
tour_ask_title: "Möchtest du eine kurze Tour?"
tour_ask_text: "Vier kurze Tipps zeigen, wie BudMinder funktioniert, mit Bildern und kurzen Clips. Das dauert etwa 3 Minuten."
tour_ask_demo_title: "Willkommen in der BudMinder-Demo"
