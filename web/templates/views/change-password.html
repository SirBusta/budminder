{{ define "views/change-password.html" }}
{{ template "common/header.html" .}}
</head>

<body>
<main id="main-content">
<!-- Settings > Account (handlers/setup.go): change the username and/or password. -->
<div class="container">
    <h1 class="text-center text-primary">{{ .lcl.account_title }}</h1>
    <div class="card shadow-sm">
        <form action="/change-password" method="POST">
            <input type="hidden" name="csrf_token" value="{{ .csrfToken }}">
            <div class="mb-3">
                <label for="username" class="form-label required">{{ .lcl.username }}</label>
                <input type="text" name="username" id="username" class="form-control" value="{{ .Username }}" maxlength="64" autocomplete="username" required>
            </div>
            <div class="mb-3">
                <label for="newPassword" class="form-label">{{ .lcl.new_password }}</label>
                <input type="password" name="new_password" id="newPassword" class="form-control" minlength="8" autocomplete="new-password">
                <div class="form-text">{{ .lcl.account_new_password_hint }}</div>
            </div>
            <div class="mb-3">
                <label for="confirmPassword" class="form-label">{{ .lcl.confirm_password }}</label>
                <input type="password" name="confirm_password" id="confirmPassword" class="form-control" minlength="8" autocomplete="new-password">
            </div>
            <hr>
            <div class="mb-3">
                <label for="currentPassword" class="form-label required">{{ .lcl.account_current_password }}</label>
                <input type="password" name="current_password" id="currentPassword" class="form-control" autocomplete="current-password" required>
                <div class="form-text">{{ .lcl.account_current_hint }}</div>
            </div>
            {{ if .Error }}
            <div class="alert alert-danger">{{ .Error }}</div>
            {{ end }}
            <div class="d-flex gap-2">
                <a href="/settings" class="btn btn-light w-50">{{ .lcl.cancel }}</a>
                <button type="submit" class="btn btn-primary w-50">{{ .lcl.account_save }}</button>
            </div>
        </form>
    </div>
</div>
<!--Embed the footer.html template at this location-->
{{ template "common/footer.html" .}}

{{ end }}
