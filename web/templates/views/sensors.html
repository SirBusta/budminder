{{ define "views/sensors.html"}}

{{ template "common/header.html" .}}
{{ template "common/header2.html" .}}

<!-- Environment (mockup E4): one tent at a time, readings strip, stacked
     charts with a shared hover line, AC Infinity device lane. Drawn by
     /static/js/sensors-page.js from the JSON in data-page. -->
<div class="container-xxl sx" id="envPage" data-page='{{ json .pageData }}'>
    <div class="sx-top">
        <div>
            <h1>{{ .lcl.en_title }}</h1>
            <p>{{ .lcl.en_subtitle }}</p>
        </div>
        <div class="sx-top-r">
            <div class="sx-seg" id="sxZones" role="group" aria-label="{{ .lcl.en_tent_switch }}"></div>
            <a href="/sensors/manage" class="sx-link"><i class="fa-solid fa-sliders me-1"></i>{{ .lcl.en_manage }}</a>
        </div>
    </div>

    <div id="sxReads"></div>
    <div class="sx-card" id="sxCard">
        <div id="sxRange"></div>
        <div id="sxMults"></div>
        <div class="sx-hint" id="sxHint">{{ .lcl.en_hint }}</div>
        <div class="sx-lane" id="sxLane">
            <div class="sx-lane-labels" id="sxLaneLabels"></div>
            <div class="sx-lane-chart" id="sxLaneBox"><canvas id="sxLaneCanvas" aria-label="{{ .lcl.en_devices }}" role="img"></canvas></div>
        </div>
    </div>
    <div id="sxEmpty"></div>
</div>

<script src="/static/vendor/chartjs/chart.umd.min.js"></script>
<script src="/static/vendor/chartjs/chartjs-adapter-date-fns.bundle.min.js"></script>
<script src="/static/vendor/chartjs/chartjs-plugin-zoom.min.js"></script>
<script src="/static/js/sensors-page.js"></script>

{{ template "common/footer.html" .}}

{{ end }}
