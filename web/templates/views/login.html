{{ define "views/login.html" }}
{{ template "common/header.html" .}}
</head>

<body>
<main id="main-content" class="fm-auth sx">
    <div class="fm-auth-box">
        <div class="fm-auth-brand">
            <img src="/static/img/brand/budminder-wordmark.svg" alt="BudMinder" class="brand-light">
            <img src="/static/img/brand/budminder-wordmark-dark.svg" alt="BudMinder" class="brand-dark">
        </div>
        <form class="fm-auth-card" action="/login" method="POST">
            <input type="hidden" name="csrf_token" value="{{ .csrfToken }}">
            <div class="fm-auth-div" aria-hidden="true"><i class="fa-solid fa-seedling"></i></div>
            <h1>{{ .lcl.fm_sign_in }}</h1>
            <p class="lead">{{ .lcl.fm_sign_in_lead }}</p>
            {{ if .Error }}
            <div class="fm-err mb-3" role="alert"><i class="fa-solid fa-circle-exclamation mt-1" aria-hidden="true"></i><div>{{ .Error }}</div></div>
            {{ end }}
            <div class="fm-f">
                <label for="username">{{ .lcl.username }}</label>
                <input type="text" id="username" name="username" class="form-control" autocomplete="username" required autofocus>
            </div>
            <div class="fm-f">
                <label for="password">{{ .lcl.password }}</label>
                <div class="fm-pw">
                    <input type="password" id="password" name="password" class="form-control" autocomplete="current-password" required>
                    <button type="button" aria-label="{{ .lcl.fm_show_password }}" data-show="{{ .lcl.fm_show_password }}" data-hide="{{ .lcl.fm_hide_password }}"><i class="fa-regular fa-eye"></i></button>
                </div>
            </div>
            <label class="fm-check"><input type="checkbox" class="form-check-input" id="remember" name="remember"> {{ .lcl.remember_me }}</label>
            <button type="submit" class="fm-btn block"><i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i> {{ .lcl.fm_sign_in }}</button>
        </form>
        {{ template "common/auth-foot.html" . }}
    </div>

<!--Embed the footer.html template at this location-->
{{ template "common/footer.html" .}}

{{ end }}
