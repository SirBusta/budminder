{{ define "views/plants.html"}}

{{ template "common/header.html" .}}
{{ template "common/header2.html" .}}

<!-- Plants (mockup PL3): Growing / Harvested / Dead tabs with a summary,
     filters, and a row per plant with a progress bar from planting to the
     estimated harvest ("Cards" shows photo tiles). Drawn by
     /static/js/plants-page.js from the JSON in data-page. -->
<div class="container-xxl pl" id="plantsPage" data-page='{{ json .pageData }}'>
    <div class="pl-head">
        <div class="pl-top">
            <div>
                <h1>{{ .lcl.pl_title }}</h1>
                <p>{{ .lcl.pl_subtitle }}</p>
            </div>
            {{ if .loggedIn }}
            <a class="pl-add" href="/plant/new"><i class="fa-solid fa-plus me-1"></i>{{ .lcl.pl_add_plant }}</a>
            {{ end }}
        </div>
        <div class="pl-tabs" id="plTabs" role="tablist"></div>
        <div class="pl-sum" id="plSum"></div>
    </div>
    <div id="plBar"></div>
    <div id="plOut"></div>
</div>

<script src="/static/js/plants-page.js" defer></script>

{{ template "common/footer.html" .}}

{{ end }}
