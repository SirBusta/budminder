{{ define "common/header.html" }}

<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">

    {{ if .csrfToken }}<meta name="csrf-token" content="{{ .csrfToken }}">{{ end }}
    <title>BudMinder {{ .title }}</title>
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" href="/static/img/brand/budminder-icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/static/img/brand/apple-touch-icon.png">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#16a34a">
    <!-- Bootstrap core CSS -->
    <!-- Third-party libraries are bundled under /static/vendor/ so pages never
         load anything from other sites (Bootstrap 5.3.3, Font Awesome 6.7.1). -->
    <link href="/static/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
    <!-- Icons: Font Awesome CSS + local webfonts -->
    <link rel="stylesheet" href="/static/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/static/css/isley.css">
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/csrf.js"></script>
    {{ if demoMode }}
    <meta name="robots" content="noindex, nofollow">
    <script type="application/json" id="bmDemoNotes">{{ demoNotes }}</script>
    <script type="application/json" id="bmDemoText">{"notAvailable": {{ .lcl.demo_not_available }}, "noTyping": {{ .lcl.demo_no_typing }}, "pickNote": {{ .lcl.demo_pick_note }}, "noNote": {{ .lcl.demo_no_note }}}</script>
    <script src="/static/js/demo.js"></script>
    {{ end }}
    <!-- Reusable autocomplete select widget (loaded early for page scripts) -->
    <script src="/static/js/isley-autocomplete.js"></script>
    <!-- "Add the strain first": Add Plant / Edit plant <-> Strains page -->
    <script src="/static/js/strain-first.js"></script>
{{ end }}
