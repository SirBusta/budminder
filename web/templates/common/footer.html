<!-- Toast container (for ui-messages.js) -->
<div id="uiToastContainer" class="position-fixed bottom-0 end-0 p-3" style="z-index: 1080; pointer-events: none;"></div>

<!-- Bootstrap core JavaScript -->
<script src="/static/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<!-- UI messages helper (toasts + confirm modal + i18n fetch) -->
<script src="/static/js/ui-messages.js"></script>
<!-- Form UX helpers (submit spinner + inline validation) -->
<script src="/static/js/form-helpers.js"></script>
<!-- Accessible focus trapping for all Bootstrap modals -->
<script src="/static/js/focus-trap.js"></script>
<!-- Global modal backdrop cleanup: Bootstrap's backdrop can linger when
     the page reloads while a modal fade-out animation is in progress.
     This listener removes any orphaned backdrops on every modal close. -->
<script nonce="{{ .cspNonce }}">
document.addEventListener("DOMContentLoaded", () => {
    document.addEventListener('hidden.bs.modal', () => {
        document.querySelectorAll('.modal-backdrop').forEach(b => b.remove());
        document.body.classList.remove('modal-open');
        document.body.style.overflow = '';
    });
});
</script>
