{{ define "modals/multi-plant-activity-modal.html" }}
<!-- Log activity for one or several plants (top-menu button). Same combined
     format as the Plant page: ticks for every activity type + one note;
     added to whatever each plant already has that day. -->
<div class="modal fade" id="addMultiPlantActivityModal" tabindex="-1" aria-labelledby="addMultiPlantActivityModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content pp-dialog">
            <div class="modal-header">
                <h5 class="modal-title" id="addMultiPlantActivityModalLabel"><i class="fa-solid fa-plus me-2"></i>{{ .lcl.pp_log_activity }}</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="{{ .lcl.title_close }}"></button>
            </div>
            <div class="modal-body">
                <label class="form-label small fw-semibold mb-1">{{ .lcl.pp_plants }}</label>
                <div class="pp-tchips mb-1" id="mpPlants">
                    {{ range .plants }}<button type="button" class="pp-tchip" data-pid="{{ .ID }}" data-zone="{{ .ZoneName }}" style="--c:#0d9488"><i class="fa-solid fa-cannabis"></i> {{ .Name }}</button>
                    {{ end }}
                </div>
                <div class="mb-2 d-flex gap-3 flex-wrap" id="mpTents" data-label="{{ .lcl.pp_everything_in }}"></div>
                <div class="row g-2 mb-3"><div class="col-sm-6">
                    <label class="form-label small text-muted mb-0" for="mpDate">{{ .lcl.pp_date }}</label>
                    <input type="date" class="form-control form-control-sm" id="mpDate">
                </div></div>
                <label class="form-label small fw-semibold mb-1">{{ .lcl.pp_select_all_apply }}</label>
                <div class="pp-tchips mb-2" id="mpTypes">
                    {{ range .activities }}<button type="button" class="pp-tchip" data-t="{{ .ID }}" data-name="{{ .Name }}" data-watering="{{ .IsWatering }}" data-feeding="{{ .IsFeeding }}" data-metrics='{{ json .Metrics }}' style="--c:{{ .Color }}"><i class="fa-solid {{ .Icon }}"></i> {{ .Name }}</button>
                    {{ end }}
                </div>
                <div id="mpNumbers" class="mb-2"></div>
                <textarea class="form-control" id="mpNote" rows="3" placeholder="{{ .lcl.pp_notes_placeholder }}"></textarea>
                <div class="text-danger small mt-2 d-none" id="mpError"
                     data-pick-plant="{{ .lcl.pp_pick_plant }}" data-pick-activity="{{ .lcl.pp_pick_activity }}" data-number="{{ .lcl.pp_number_required }}"></div>
                <p class="small text-muted mt-2 mb-0">{{ .lcl.pp_logging_several }}</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">{{ .lcl.pp_cancel }}</button>
                <button type="button" class="btn btn-success" id="mpSave"><i class="fa-solid fa-check me-1"></i>{{ .lcl.pp_save }}</button>
            </div>
        </div>
    </div>
</div>

<script src="/static/js/multi-plant-activity-modal.js"></script>
{{ end }}
